<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>パチンコ回転率カウンター</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation; /* 連打時のズーム防止 */
    }

    body {
      background-color: #121212;
      color: #e0e0e0;
      padding: 16px;
      max-width: 480px;
      margin: 0 auto;
      user-select: none;
    }

    h1 {
      font-size: 1.2rem;
      text-align: center;
      margin-bottom: 16px;
      color: #00e676;
    }

    .card {
      background-color: #1e1e1e;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    .mode-selector {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .mode-btn {
      flex: 1;
      padding: 10px;
      border: 1px solid #333;
      background-color: #2a2a2a;
      color: #888;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .mode-btn.active {
      background-color: #00e676;
      color: #121212;
      border-color: #00e676;
    }

    .label {
      font-size: 0.85rem;
      color: #aaa;
      margin-bottom: 6px;
    }

    .input-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input[type="number"] {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background-color: #2a2a2a;
      color: #fff;
      font-size: 1.2rem;
      text-align: center;
    }

    .btn {
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.1s;
    }

    .btn:active {
      opacity: 0.7;
    }

    .ctrl-btn {
      width: 48px;
      height: 48px;
      background-color: #333;
      color: #fff;
      font-size: 1.4rem;
      flex-shrink: 0;
    }

    .investment-ctrl {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }

    .k-btn {
      padding: 14px 0;
      font-size: 1.1rem;
      border-radius: 8px;
    }

    .btn-add {
      background-color: #2196f3;
      color: #fff;
    }

    .btn-sub {
      background-color: #e53935;
      color: #fff;
    }

    .result-display {
      text-align: center;
      padding: 12px 0;
    }

    .rate-val {
      font-size: 2.5rem;
      font-weight: bold;
      color: #00e676;
      line-height: 1.2;
    }

    .rate-unit {
      font-size: 0.9rem;
      color: #aaa;
    }

    .status-badge {
      display: inline-block;
      margin-top: 8px;
      padding: 4px 12px;
      border-radius: 16px;
      font-size: 0.85rem;
      font-weight: bold;
    }

    .status-ok {
      background-color: rgba(0, 230, 118, 0.2);
      color: #00e676;
    }

    .status-ng {
      background-color: rgba(229, 57, 53, 0.2);
      color: #ff5252;
    }

    .status-wait {
      background-color: rgba(255, 255, 255, 0.1);
      color: #aaa;
    }

    .reset-btn {
      width: 100%;
      padding: 12px;
      background-color: #2a2a2a;
      color: #888;
      border: 1px solid #333;
      border-radius: 8px;
      margin-top: 12px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>回転率分析カウンター</h1>

  <!-- スペック切替 -->
  <div class="mode-selector">
    <button class="mode-btn active" id="modeDeka" onclick="setMode('deka')">デカヘソ (3k判定)</button>
    <button class="mode-btn" id="modeNormal" onclick="setMode('normal')">通常機 (5k判定)</button>
  </div>

  <!-- 打ち始め回転数 -->
  <div class="card">
    <div class="label">打ち始め回転数</div>
    <div class="input-group">
      <button class="btn ctrl-btn" onclick="adjustValue('startGames', -10)">-10</button>
      <input type="number" id="startGames" value="0" min="0" oninput="calculate()">
      <button class="btn ctrl-btn" onclick="adjustValue('startGames', 10)">+10</button>
    </div>
  </div>

  <!-- 現在回転数 -->
  <div class="card">
    <div class="label">現在回転数</div>
    <div class="input-group">
      <button class="btn ctrl-btn" onclick="adjustValue('currentGames', -1)">-1</button>
      <input type="number" id="currentGames" value="0" min="0" oninput="calculate()">
      <button class="btn ctrl-btn" onclick="adjustValue('currentGames', 1)">+1</button>
    </div>
  </div>

  <!-- 投資額 -->
  <div class="card">
    <div class="label">総投資額: <span id="investLabel" style="color:#2196f3; font-weight:bold;">0</span>k円</div>
    <div class="investment-ctrl">
      <button class="btn k-btn btn-sub" onclick="addInvestment(-1)">-1k</button>
      <button class="btn k-btn btn-add" onclick="addInvestment(1)">+1k</button>
      <button class="btn k-btn btn-add" style="background-color: #ff9800;" onclick="addInvestment(0.5)">+0.5k</button>
    </div>
  </div>

  <!-- 計算結果 -->
  <div class="card">
    <div class="result-display">
      <div class="label">現在の回転率</div>
      <div class="rate-val" id="rateVal">0.0</div>
      <div class="rate-unit">回転 / 1k</div>
      <div id="statusBadge" class="status-badge status-wait">投資待ち</div>
    </div>
  </div>

  <button class="reset-btn" onclick="resetAll()">データをリセット</button>

  <script>
    let mode = 'deka';
    let investment = 0;

    function setMode(newMode) {
      mode = newMode;
      document.getElementById('modeDeka').classList.toggle('active', mode === 'deka');
      document.getElementById('modeNormal').classList.toggle('active', mode === 'normal');
      calculate();
    }

    function adjustValue(id, diff) {
      const input = document.getElementById(id);
      let val = parseInt(input.value) || 0;
      val = Math.max(0, val + diff);
      input.value = val;
      calculate();
    }

    function addInvestment(amount) {
      investment = Math.max(0, investment + amount);
      document.getElementById('investLabel').textContent = investment;
      calculate();
    }

    function calculate() {
      const start = parseInt(document.getElementById('startGames').value) || 0;
      const current = parseInt(document.getElementById('currentGames').value) || 0;
      const rateValEl = document.getElementById('rateVal');
      const badgeEl = document.getElementById('statusBadge');

      const rotated = current - start;

      if (investment <= 0 || rotated <= 0) {
        rateValEl.textContent = '0.0';
        badgeEl.className = 'status-badge status-wait';
        badgeEl.textContent = '投資待ち';
        return;
      }

      const rate = (rotated / investment).toFixed(1);
      rateValEl.textContent = rate;

      // 判定閾値
      const targetK = mode === 'deka' ? 3 : 5;

      if (investment < targetK) {
        badgeEl.className = 'status-badge status-wait';
        badgeEl.textContent = `判定まであと ${(targetK - investment).toFixed(1)}k`;
      } else {
        // 仮のボーダー基準（モードに応じて調整可能）
        const border = mode === 'deka' ? 25.0 : 17.0;
        if (parseFloat(rate) >= border) {
          badgeEl.className = 'status-badge status-ok';
          badgeEl.textContent = `続行推奨 (ボーダー超え: ${border})`;
        } else {
          badgeEl.className = 'status-badge status-ng';
          badgeEl.textContent = `撤退検討 (ボーダー未満: ${border})`;
        }
      }
    }

    function resetAll() {
      if (!confirm('データをリセットしますか？')) return;
      document.getElementById('startGames').value = 0;
      document.getElementById('currentGames').value = 0;
      investment = 0;
      document.getElementById('investLabel').textContent = 0;
      calculate();
    }
  </script>
</body>
</html>
